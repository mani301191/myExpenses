<div class="row content" >
  <!-- Summary View -->
  @if (selectedView === 'summary') {
    <div id="print-summary" class="col-sm-12">
      <app-expense-summary-table></app-expense-summary-table>
    </div>
  }

  <!-- Monthly View -->
  @if (selectedView === 'monthly') {
    <div>
      <app-expense-monthly></app-expense-monthly>
    </div>
  }

  <!-- Yearly View -->
  @if (selectedView === 'yearly') {
    <div id="print-yearly" class="col-sm-12">
      <app-expense-yearly></app-expense-yearly>
    </div>
  }
</div>
