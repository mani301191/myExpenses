<div class="document-section">
  <div class="row">
    <div class="col-xs-12">
      <h3 class="brandcolor">Documents</h3>
    </div>
  </div>
  <hr class="lineBreak">

  <div class="upload-panel">
    <div class="row">
      <div class="col-xs-12 col-md-4">
        <label class="upload-label">Select File</label>
        <input type="file" #fileInput class="form-control" (change)="onFileSelected($event)">
      </div>
      <div class="col-xs-12 col-md-8 keyword-action">
        <mat-form-field appearance="outline" class="keyword-field">
          <mat-label>Keywords</mat-label>
          <input matInput [(ngModel)]="keywords" placeholder="comma,separated,keywords">
        </mat-form-field>
        <button color="primary" class="button" (click)="upload()" [disabled]="!selectedFile">Upload</button>
        <a color="primary" (click)="resetForm()">Clear</a>
      </div>
    </div>
  </div>

  <div class="row search-row">
    <div class="col-xs-12 col-md-4">
      <mat-form-field class="doNotPrint full-width">
        <mat-icon matTextPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchKeyword" (keyup.enter)="search()"
          placeholder="Search by keyword">
      </mat-form-field>
    </div>
    <div class="col-xs-12 col-md-8 search-actions">
      <button color="primary" class="button" (click)="search()">Search</button>
      <a color="primary" (click)="clearSearch()">Clear</a>
    </div>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSortActive="uploadedDate" matSortDirection="desc" matSort>

      <ng-container matColumnDef="preview">
        <th mat-header-cell *matHeaderCellDef class="tableHeader"> Preview </th>
        <td mat-cell *matCellDef="let row">
          @if (isImage(row)) {
            <a [href]="downloadUrl(row.documentId)" matTooltip="Click to download">
              <img [src]="previewUrl(row.documentId)" class="document-thumb" [alt]="row.fileName">
            </a>
          } @else {
            <a [href]="downloadUrl(row.documentId)" class="buttonIcon" matTooltip="Click to download">
              <mat-icon class="document-icon">insert_drive_file</mat-icon>
            </a>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="fileName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="tableHeader"> File Name </th>
        <td mat-cell *matCellDef="let row"> {{row.fileName}} </td>
      </ng-container>

      <ng-container matColumnDef="keywords">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="tableHeader"> Keywords </th>
        <td mat-cell *matCellDef="let row"> {{row.keywords}} </td>
      </ng-container>

      <ng-container matColumnDef="fileSize">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="tableHeader"> Size </th>
        <td mat-cell *matCellDef="let row"> {{formatSize(row.fileSize)}} </td>
      </ng-container>

      <ng-container matColumnDef="uploadedDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="tableHeader"> Uploaded </th>
        <td mat-cell *matCellDef="let row"> {{row.uploadedDate}} </td>
      </ng-container>

      <ng-container matColumnDef="actionsColumn">
        <th mat-header-cell *matHeaderCellDef class="tableHeader"> Action </th>
        <td mat-cell *matCellDef="let row">
          <a [href]="downloadUrl(row.documentId)" class="buttonIcon" matTooltip="Download">
            <mat-icon>download</mat-icon>
          </a>
          <button class="buttonIcon" (click)="deleteRow(row)" matTooltip="Delete Record">
            <i class="fa fa-trash"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No documents found</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" aria-label="Select page " id="mat-paginator"
      showFirstLastButtons></mat-paginator>
  </div>
</div>
